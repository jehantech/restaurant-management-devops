    \    \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\"\
    : []\n      }\n    },\n    {\n      \"id\": 8,\n      \"type\": \"timeseries\"\
    ,\n      \"title\": \"Minikube Memory Usage\",\n      \"gridPos\": {\n       \
    \ \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 12\n     \
    \ },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\"\
