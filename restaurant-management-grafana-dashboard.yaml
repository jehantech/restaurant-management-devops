    \n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"sum(kube_pod_container_status_restarts_total{namespace=\\\
    \"default\\\",pod=~\\\"menu-service-.*\\\"})\",\n          \"legendFormat\": \"\
    Menu Service\"\n        },\n        {\n          \"refId\": \"C\",\n         \
    \ \"expr\": \"sum(kube_pod_container_status_restarts_total{namespace=\\\"default\\\
