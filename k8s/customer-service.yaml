apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: murakan001/customer-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003

          volumeMounts:
            - name: customer-data
              mountPath: /app/data

      volumes:
        - name: customer-data
          persistentVolumeClaim:
            claimName: customer-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP